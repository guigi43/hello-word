<title>Récolement EP Bâtiment D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --f-cond:"Archivo Narrow","Arial Narrow",Helvetica,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;

    --paper:#E7EAED;
    --sheet:#FFFFFF;
    --ink:#1D2836;
    --ink-2:#5E6D7E;
    --ink-3:#8896A5;
    --rule:#C2CBD4;
    --grid-1:rgba(29,40,54,.055);
    --grid-2:rgba(29,40,54,.115);
    --bld-fill:#DFE4E9;
    --ep:#9A4712;
    --ep-soft:#F2E0D2;
    --exist:#41647A;
    --shadow:0 1px 2px rgba(29,40,54,.06),0 10px 30px -14px rgba(29,40,54,.28);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0F1319; --sheet:#181E26;
      --ink:#DFE6ED; --ink-2:#9DACBA; --ink-3:#78889A;
      --rule:#374350;
      --grid-1:rgba(223,230,237,.06); --grid-2:rgba(223,230,237,.13);
      --bld-fill:#2A323C;
      --ep:#E39457; --ep-soft:#3B2A1D;
      --exist:#7FA7BE;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.75);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1319; --sheet:#181E26;
    --ink:#DFE6ED; --ink-2:#9DACBA; --ink-3:#78889A;
    --rule:#374350;
    --grid-1:rgba(223,230,237,.06); --grid-2:rgba(223,230,237,.13);
    --bld-fill:#2A323C;
    --ep:#E39457; --ep-soft:#3B2A1D;
    --exist:#7FA7BE;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink)}
  .wrap{max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:28px}
  .sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);
         overflow-x:auto}
  .sheet svg{display:block;min-width:880px;width:100%;height:auto}

  .sh-bg{fill:var(--sheet)}
  .g-fine{stroke:var(--grid-1);stroke-width:.6;fill:none}
  .g-coarse{stroke:var(--grid-2);stroke-width:.9;fill:none}
  .bld{fill:var(--bld-fill);stroke:var(--ink-2);stroke-width:1}
  .facade{stroke:var(--ink);stroke-width:3;fill:none}
  .ln{stroke:var(--ink);stroke-width:1.2;fill:none}
  .ln-thin{stroke:var(--ink-2);stroke-width:.8;fill:none}
  .ext{stroke:var(--ink-3);stroke-width:.7;fill:none;stroke-dasharray:4 3}
  .dim{stroke:var(--ink);stroke-width:1;fill:none}
  .pipe-out{stroke:var(--ep);stroke-width:15.6;fill:none;stroke-linejoin:round}
  .pipe-in{stroke:var(--ep-soft);stroke-width:13.6;fill:none;stroke-linejoin:round}
  .pipe-ax{stroke:var(--ep);stroke-width:.7;fill:none;stroke-dasharray:8 3 1.5 3;opacity:.8}
  .ep-f{fill:var(--ep)}
  .ep-l{stroke:var(--ep);fill:none}
  .ex-l{stroke:var(--exist);fill:none}
  .sheet-f{fill:var(--sheet)}
  .t{font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.06em;fill:var(--ink)}
  .t-s{font-family:var(--f-cond);font-weight:600;font-size:10px;letter-spacing:.08em;fill:var(--ink-3)}
  .t-big{font-family:var(--f-cond);font-weight:700;font-size:15px;letter-spacing:.2em;fill:var(--ink-2)}
  .t-rep{font-family:var(--f-cond);font-weight:700;font-size:12.5px;letter-spacing:.1em;fill:var(--ink)}
  .n{font-family:var(--f-mono);font-weight:500;font-size:11.5px;fill:var(--ink)}
  .n-ep{font-family:var(--f-mono);font-weight:600;font-size:11.5px;fill:var(--ep)}
  .n-s{font-family:var(--f-mono);font-weight:400;font-size:10px;fill:var(--ink-2)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="sheet">
    <svg viewBox="0 0 1020 400" role="img"
         aria-label="Vue en plan du récolement EP le long du bâtiment D. Façade de 8,00 m. Grille fonte 40 sur 40 à l'angle gauche, fil d'eau 166,56, à 0,50 m du mur. Canalisation PVC Ø160 longeant la façade jusqu'à un coude d'environ 15 degrés à 5,00 m de l'angle gauche, écarté de 0,35 m, fil d'eau 166,51. Puis 3,00 m jusqu'au regard carré existant aligné sur l'angle droit du bâtiment, à 1,20 m de la façade, fil d'eau 166,46. Seuils garage 167,02 et entrée 166,97.">
      <defs>
        <marker id="ahA" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5"
                orient="auto-start-reverse"><path d="M0.5,1 L9.2,5 L0.5,9 Z" style="fill:var(--ink)"/></marker>
        <pattern id="gA" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="translate(140,170)">
          <path class="g-fine" d="M22.5 0V90 M45 0V90 M67.5 0V90 M0 22.5H90 M0 45H90 M0 67.5H90"/>
          <path class="g-coarse" d="M0 0V90 M0 0H90"/>
        </pattern>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <path d="M0 0V7" style="stroke:var(--ink-3);stroke-width:.7;opacity:.5"/>
        </pattern>
      </defs>

      <rect class="sh-bg" x="0" y="0" width="1020" height="400"/>
      <rect x="0" y="0" width="1020" height="400" fill="url(#gA)"/>

      <!-- cotes du bâtiment -->
      <path class="ln-thin" d="M140 62 V20 M860 62 V20"/>
      <path class="dim" d="M140 26 H860" marker-start="url(#ahA)" marker-end="url(#ahA)"/>
      <text class="n" x="500" y="20" text-anchor="middle">8,00</text>
      <path class="dim" d="M140 54 H860"/>
      <path class="dim" d="M135 60 L145 48 M585 60 L595 48 M855 60 L865 48"/>
      <text class="n" x="365" y="47" text-anchor="middle">5,00</text>
      <text class="n" x="725" y="47" text-anchor="middle">3,00</text>

      <!-- alignement angle droit / regard -->
      <path class="ex-l" stroke-width="1" stroke-dasharray="10 4 2 4" opacity=".85" d="M860 62 V245 M860 311 V322"/>

      <!-- bâtiment -->
      <rect class="bld" x="140" y="66" width="720" height="104"/>
      <rect x="140" y="66" width="720" height="104" fill="url(#hatch)" stroke="none"/>
      <text class="t-big" x="500" y="112" text-anchor="middle">BÂTIMENT D</text>
      <path class="facade" d="M140 170 H860"/>
      <path class="ext" d="M860 170 H936"/>

      <!-- ligne de rappel du coude -->
      <path class="ext" d="M590 48 V201.5"/>

      <!-- seuils -->
      <path class="ln" d="M133 163 L147 177 M133 177 L147 163"/>
      <path class="ln" d="M583 163 L597 177 M583 177 L597 163"/>
      <text class="t" x="154" y="155">seuil garage <tspan class="n" dx="2">167,02</tspan></text>
      <text class="t" x="604" y="155">seuil entrée <tspan class="n" dx="2">166,97</tspan></text>

      <!-- canalisation -->
      <polyline class="pipe-out" points="158,197.2 590,201.5 833,270.35"/>
      <polyline class="pipe-in"  points="158,197.2 590,201.5 833,270.35"/>
      <polyline class="pipe-ax"  points="158,197.2 590,201.5 833,270.35"/>
      <polygon class="ep-f" points="429,199.8 413,196.6 413,203.0"/>
      <polygon class="ep-f" points="737.7,243.4 723.3,242.9 725.1,236.3"/>
      <text class="t" x="370" y="228" text-anchor="middle" style="fill:var(--ep)">PVC Ø 160 — EP</text>

      <!-- coude -->
      <circle class="ep-f" cx="590" cy="201.5" r="3.4"/>
      <path class="ep-l" stroke-width="1" d="M654 202.1 A 64 64 0 0 1 651.6 218.9"/>
      <text class="n-ep" x="664" y="199">≈ 15°</text>

      <!-- grille 40x40 -->
      <rect class="sheet-f" x="122" y="179" width="36" height="36"/>
      <rect class="ep-l" x="122" y="179" width="36" height="36" stroke-width="2"/>
      <path class="ep-l" stroke-width=".8" d="M131 181V213 M140 181V213 M149 181V213"/>

      <!-- regard carré existant -->
      <rect class="sheet-f" x="833" y="251" width="54" height="54"/>
      <rect class="ex-l" x="833" y="251" width="54" height="54" stroke-width="2.5"/>
      <rect class="ex-l" x="841" y="259" width="38" height="38" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- cotes transversales -->
      <path class="dim" d="M110 170 V215" marker-start="url(#ahA)" marker-end="url(#ahA)"/>
      <path class="ln-thin" d="M106 215 H122"/>
      <text class="n" x="102" y="197" text-anchor="end">0,50</text>

      <path class="ln-thin" d="M590 201.5 H624"/>
      <path class="dim" d="M618 170 V201.5" marker-start="url(#ahA)" marker-end="url(#ahA)"/>
      <text class="n" x="628" y="189">0,35</text>

      <path class="ln-thin" d="M887 278 H936"/>
      <path class="dim" d="M930 170 V278" marker-start="url(#ahA)" marker-end="url(#ahA)"/>
      <text class="n" x="924" y="226" text-anchor="end">1,20</text>

      <!-- repères -->
      <text class="t-rep" x="150" y="243">G1</text>
      <text class="t-s" x="175" y="243">grille 40×40</text>
      <text class="n-ep" x="150" y="260">fe 166,56</text>

      <text class="t-rep" x="600" y="243">C1</text>
      <text class="t-s" x="625" y="243">coude</text>
      <text class="n-ep" x="600" y="260">fe 166,51</text>

      <text class="t-rep" x="800" y="332">R1</text>
      <text class="t-s" x="825" y="332">regard existant</text>
      <text class="n-ep" x="800" y="349">fe 166,46</text>

      <!-- échelle graphique -->
      <rect x="40" y="364" width="45" height="8" style="fill:var(--ink)"/>
      <rect x="85" y="364" width="45" height="8" class="sheet-f" stroke="var(--ink)" stroke-width="1"/>
      <rect x="130" y="364" width="45" height="8" style="fill:var(--ink)"/>
      <rect x="175" y="364" width="45" height="8" class="sheet-f" stroke="var(--ink)" stroke-width="1"/>
      <text class="n-s" x="40" y="388" text-anchor="middle">0</text>
      <text class="n-s" x="130" y="388" text-anchor="middle">1</text>
      <text class="n-s" x="220" y="388" text-anchor="middle">2 m</text>

      <!-- identification -->
      <text class="t-s" x="980" y="370" text-anchor="end">RÉCOLEMENT EP — BÂTIMENT D — VUE EN PLAN</text>
      <text class="t-s" x="980" y="386" text-anchor="end">COTES EN m · ALTITUDES NGF · TRAME 1,00 m</text>
    </svg>
  </div>
</div>
